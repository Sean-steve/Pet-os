services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: petos
      POSTGRES_USER: petos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - petos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petos -d petos"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - petos_internal

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - petos_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - petos_internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://petos:${POSTGRES_PASSWORD}@postgres:5432/petos?sslmode=disable
      DATABASE_RUNTIME_ROLE: petos_app
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS}
      AUTH_ISSUER: ${AUTH_ISSUER}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      BILLING_ADAPTER_SECRET: ${BILLING_ADAPTER_SECRET}
      LOCATION_ADAPTER_SECRET: ${LOCATION_ADAPTER_SECRET}
      AI_ADAPTER_SECRET: ${AI_ADAPTER_SECRET}
      INTEGRATION_ADAPTER_SECRET: ${INTEGRATION_ADAPTER_SECRET}
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health/ready"]
      interval: 10s
      timeout: 4s
      retries: 12
    networks:
      - petos_internal

volumes:
  petos_postgres:
  petos_redis:

networks:
  petos_internal:
    driver: bridge

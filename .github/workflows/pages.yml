name: Deploy Pet OS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force Pages to GitHub Actions mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT repos/${{ github.repository }}/pages -f build_type=workflow

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck (advisory while legacy console typings are reconciled)
        continue-on-error: true
        run: npm run typecheck

      - name: Regression suites
        run: npm test

      - name: Build for GitHub Pages
        env:
          VITE_BASE_PATH: /Pet-os/
        run: npm run build

      - name: Verify Pages artifact
        run: |
          test -f dist/index.html
          grep -q '/Pet-os/assets/' dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.css' -print -quit)"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

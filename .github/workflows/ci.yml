name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://petos:petos_ci@127.0.0.1:5432/petos
      DATABASE_RUNTIME_ROLE: petos_app
      REDIS_URL: redis://127.0.0.1:6379
      CORS_ORIGINS: http://localhost:3000
      AUTH_ISSUER: https://auth.test.petos.local
      AUTH_AUDIENCE: pet-os-api
      AUTH_JWT_SECRET: ci-test-only-pet-os-secret-32-bytes-minimum
      RATE_LIMIT_PER_MINUTE: 200
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: petos
          POSTGRES_USER: petos
          POSTGRES_PASSWORD: petos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petos -d petos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Regression suites
        run: npm test

      - name: Full-system certification
        run: npm run certification:check

      - name: Production-readiness closure
        run: npm run production-readiness:check

      - name: Backend migrations
        run: npm run db:migrate

      - name: Backend integration
        run: npm run backend:integration

      - name: Backend production bundle
        run: npm run server:build

      - name: Production container build
        run: docker build -t pet-os-api:ci .

      - name: Production frontend build
        run: npm run build

      - name: Performance budgets
        run: npm run performance:check
